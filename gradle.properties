# --- Plugin coordinates ---------------------------------------------------
pluginGroup = kz.kolesa
pluginVersion = 3.1.0

# Нижняя граница поддержки — 2023.3 (build 233), против неё же и собираемся:
# компиляция против самой старой поддерживаемой версии не даёт случайно
# задействовать API, которого там ещё нет.
# untilBuild намеренно не задан -> плагин не отваливается на каждом релизе IDE.
pluginSinceBuild = 233

# --- Target platform ------------------------------------------------------
# IntelliJ IDEA Community — общее ядро всех IDE на IntelliJ Platform, поэтому
# один артефакт ставится в PhpStorm / GoLand / PyCharm / WebStorm / RubyMine /
# CLion / RustRover / Rider без пересборки.
platformType = IC
platformVersion = 2023.3.8

# Git4Idea входит в поставку всех перечисленных IDE.
platformBundledPlugins = Git4Idea

# --- Plugin Verifier ------------------------------------------------------
# Нижняя граница + актуальные релизы. У каждой IDE своя нумерация патчей.
# IntelliJ IDEA Community (IC) больше не публикуется с 2025.3 — с этой версии
# IDEA единая, её код IU.
verifierIdes = IC-2023.3.8, PS-2023.3.8, GO-2023.3.8, PY-2023.3.7, \
               IU-2026.2.1, PS-2026.2.1, GO-2026.2.1.1, PY-2026.2.1

# --- Gradle ---------------------------------------------------------------
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
